[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "c2ai"
version = "0.2.0"
description = "C2AI (Athena) — application registration, deployment, and operations backend"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.3,<0.116",
    "starlette>=0.41.2,<0.42",
    "uvicorn>=0.25,<0.35",
    # HTTP / config / auth
    "httpx>=0.27,<0.28",
    "pydantic>=2.9.2,<3",
    "pydantic-settings>=2.6,<3",
    "cryptography>=44",
    "prometheus-client>=0.21",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "pyjwt>=2.10.1",
    "argon2-cffi>=25.1",
    # Database
    "sqlalchemy>=2.0.45",
    "asyncpg>=0.31",
    "psycopg2-binary>=2.9.11",
    "greenlet>=3.3",
    # Reports
    "reportlab>=4.4.9",
    # Troubleshooting LLM (vLLM OpenAI-compatible API)
    "langchain>=0.3.1,<0.4",
    "langchain-openai>=0.2.1,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23.8,<0.24",
    "pytest-cov>=5.0",
    "pypdf>=5.0",
    "ruff>=0.9",
]

[project.scripts]
c2ai-migrate = "c2ai.db.migrate:main"
c2ai-init-db = "c2ai.db.init_db:main"
c2ai-secret = "c2ai.auth.generate_secret:main"

[tool.setuptools.packages.find]
include = ["c2ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC", "Q", "RUF"]
ignore = [
    "E501",    # long lines are allowed (PromQL, messages)
    "B008",    # FastAPI Depends()/Query() defaults are idiomatic
    "RUF001", "RUF002", "RUF003",  # typographic dashes/arrows in prose are intentional
    "RUF012",
    "UP042",   # str+Enum -> StrEnum changes str() output; keep explicit
    "UP041",   # asyncio.TimeoutError is kept explicit in the scheduler
    "ISC004",
    "B905",
    "Q000", "Q003",  # quote style is not enforced
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["c2ai"]

[tool.setuptools.package-data]
"c2ai.constants" = ["*.json"]
